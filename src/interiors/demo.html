<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7ebd7">
  <title>Clover Hollow • Decorate your cottage</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
      --ink: #504a41; --rose: #cd8e80; --sage: #5e907b; --cream: #fff8ee;
      --paper: #f7ebd7; --line: #e3d0bb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, canvas:focus-visible {
      outline: 3px solid #4d9181; outline-offset: 2px;
    }
    button:disabled { opacity: 0.42; cursor: not-allowed; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px max(13px,env(safe-area-inset-right)) 9px max(15px,env(safe-area-inset-left));
      background: #fff8e9; border-bottom: 2px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .clover { font-size: 24px; }
    h1 { font-size: clamp(17px,2vw,23px); margin: 0; line-height: 1.14; letter-spacing: 0.01em; }
    .sub { font-size: 11px; color: #827165; margin-top: 3px; }
    #mode {
      background: #5d9180; color: white; border: 2px solid #447a69;
      border-radius: 20px; padding: 9px 15px; font-weight: 800; white-space: nowrap;
    }
    #mode.walk { background: #b98376; border-color: #9a6a60; }
    .workspace { min-height: 0; flex: 1; display: flex; }
    .palette {
      flex: 0 0 232px; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
      background: #fff7e9; border-right: 2px solid var(--line); padding: 14px 12px;
    }
    .palette h2 { margin: 0 0 4px; font-size: 16px; }
    .palette p { margin: 0 0 12px; font-size: 11px; color: #867565; }
    .inventory { display: grid; gap: 8px; grid-template-columns: repeat(2,minmax(0,1fr)); }
    .item {
      position: relative; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; min-height: 89px; padding: 8px 4px;
      border: 2px solid #ebd8c1; border-radius: 15px; background: #fffefa; color: var(--ink);
      box-shadow: 0 2px 0 #dbc9b2;
    }
    .item:not(:disabled):hover { border-color: #8db09b; background: #f4faef; }
    .item .emoji { font-size: 28px; }
    .item .name { font-size: 11px; line-height: 1.13; font-weight: 800; }
    .count {
      position: absolute; right: 5px; top: 5px; border-radius: 9px;
      background: #dbede0; padding: 1px 5px; font-size: 10px; font-weight: 900;
    }
    .stage {
      position: relative; flex: 1; min-width: 0; min-height: 0;
      background: radial-gradient(ellipse at 53% 48%, #e2f2e0 0%, #c4daca 79%);
    }
    canvas { display: block; height: 100%; width: 100%; touch-action: none; }
    .scene-tip {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      max-width: calc(100% - 28px); border: 1px solid #e1d3ba;
      border-radius: 50px; background: rgba(255,250,235,0.9);
      color: #5b6256; font-size: 11px; padding: 7px 12px; text-align: center;
      pointer-events: none; white-space: normal;
    }
    .toolbar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
      background: #fffaf0; border-top: 2px solid var(--line); overflow-x: auto;
    }
    .toolbar button, #reset {
      min-height: 40px; padding: 7px 15px; border-radius: 13px;
      border: 2px solid #dec9b2; background: #fffdfa; color: #5b5044; font-weight: 800;
      white-space: nowrap;
    }
    .toolbar .primary { background: #6da58c; border-color: #52866f; color: white; }
    .toolbar .danger { background: #fff0e8; border-color: #e1b4a1; color: #995d4f; }
    .status {
      padding: 6px 15px max(8px,env(safe-area-inset-bottom));
      font-size: 12px; text-align: center; background: #f2e5cf;
      min-height: 28px; color: #665d4e; font-weight: 650;
    }
    #reset { width: 100%; margin-top: 11px; font-size: 11px; min-height: 34px; }
    .hidden-when-walking { display: block; }
    @media (max-width: 740px) and (orientation: portrait) {
      .workspace { flex-direction: column; }
      .stage { order: 0; }
      .palette {
        order: 1; flex: 0 0 148px; width: 100%; border-right: 0;
        border-top: 2px solid var(--line); overflow: auto; padding: 9px 10px;
      }
      .palette h2 { font-size: 13px; }
      .palette p { display: none; }
      .inventory { display: flex; gap: 7px; width: max-content; padding-bottom: 4px; }
      .item { min-width: 90px; min-height: 86px; max-width: 90px; }
      #reset { margin-top: 6px; }
      .toolbar { justify-content: flex-start; }
      .toolbar button { min-height: 43px; padding: 8px 12px; }
    }
    @media (max-height: 470px) and (orientation: landscape) {
      header { padding-top: 5px; padding-bottom: 5px; }
      .brand .clover { font-size: 18px; }
      .sub { display: none; }
      #mode { padding: 5px 13px; }
      .palette { flex-basis: 175px; padding: 8px; }
      .palette h2 { font-size: 12px; }
      .palette p { display: none; }
      .inventory { gap: 5px; }
      .item { min-height: 64px; padding: 4px 2px; border-radius: 10px; }
      .item .emoji { font-size: 20px; }
      .item .name { font-size: 9px; }
      .toolbar { padding-top: 3px; padding-bottom: 3px; }
      .toolbar button { min-height: 31px; padding: 3px 9px; font-size: 12px; }
      .status { font-size: 10px; min-height: 23px; padding-top: 3px; padding-bottom: 4px; }
      .scene-tip { bottom: 4px; font-size: 10px; padding: 4px 7px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="clover" aria-hidden="true">🍀</span>
        <div><h1>Our Little Clover Cottage</h1><div class="sub">A home for all the things that make you smile</div></div>
      </div>
      <button id="mode" type="button" aria-pressed="true">✦ Decorating</button>
    </header>
    <div class="workspace">
      <aside class="palette" aria-label="Furniture to place">
        <h2>My little treasures</h2>
        <p>Tap an item, then find its perfect spot.</p>
        <div id="inventory" class="inventory" aria-label="Owned furniture"></div>
        <button id="reset" type="button">↺ Reset sample room</button>
      </aside>
      <main class="stage" aria-label="Three-dimensional dollhouse">
        <canvas id="scene" tabindex="0" aria-label="Dollhouse room. Tap furniture to select it, or the floor to place an item."></canvas>
        <div class="scene-tip" id="tip">Tap furniture to decorate · Drag to move · R to rotate</div>
      </main>
    </div>
    <nav class="toolbar" aria-label="Furniture editing">
      <button id="move" type="button">↔ Move</button>
      <button id="rotate" type="button">⟳ Rotate</button>
      <button id="place" class="primary" type="button">✓ Place</button>
      <button id="retrieve" type="button">▣ Put away</button>
      <button id="cancel" class="danger" type="button">✕ Cancel</button>
    </nav>
    <div id="status" class="status" role="status" aria-live="polite">Welcome home. Everything here is yours to arrange!</div>
  </div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
