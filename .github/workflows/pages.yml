name: Clover Hollow Checks and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clover-hollow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pure state and syntax tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js for source-based character tests
        run: npm install --no-audit --no-fund
      - name: Check module syntax
        run: |
          node --check src/main.js
          node --check src/input/movement.js
          node --check src/input/movement.test.js
          node --check src/camera/camera-math.js
          node --check src/camera/camera-rig.js
          node --check src/characters/chibi.js
          node --check src/characters/animation.js
          node --check src/visual/gfx.js
          node --check src/architecture/design.js
          node --check src/architecture/generator.js
          node --check src/architecture/approved-cottage.js
          node --check src/environment/landscape.js
          node --check src/environment/street-life.js
          node --check src/gameplay/market-adventure.js
          node --check src/gameplay/market-scene.js
          node --check src/gameplay/moonring-toss.js
          node --check src/interiors/fairy-details.js
          node --check src/ui/app-ui.js
          node --check src/viewmodels/game-view-model.js
          node --check src/viewmodels/decorating-view-model.js
          node --check src/story/dialogue.js
          node --check src/rules.js
          node --check src/art.js
          node --check src/town.js
          node --check src/atmosphere/storybook-atmosphere.js
          node --check src/audio/town-soundscape.js
          node --check src/audio/clover-theme.js
          node --check src/performance/graphics-quality.js
          node --check src/rendering/storybook-lighting.js
          node --check src/rendering/storybook-materials.js
          node --check src/world/layout.js
          node --check src/world/navigation.js
          node --check src/simulation/town-life.js
          node --check src/world/district-plan.js
          node --check src/city/infrastructure.js
          node --check src/city/district-interactions.js
          node --check src/districts/downtown/index.js
          node --check src/districts/entertainment/index.js
          node --check src/services/downtown/index.js
          node --check src/civic/interior.js
          node --check src/activities/entertainment/index.js
          node --check src/events/entertainment/index.js
          node --check src/interiors/dollhouse.js
          node --check src/interiors/placement-controller.js
          node --check src/interiors/room-walker.js
      - name: Run unit tests
        run: npm test

  browser:
    name: Three.js playable town and cottage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test driver
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the real Three.js experience
        run: node test/browser-smoke.mjs
      - name: Upload desktop and iPhone review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clover-hollow-desktop-and-mobile
          path: test-results/
          if-no-files-found: ignore
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clover-hollow-browser-failure
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
